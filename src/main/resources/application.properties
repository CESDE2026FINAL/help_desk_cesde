
# ==========================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ==========================================

spring.application.name=help_desk_cesde

# ==========================================
# BASE DE DATOS MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk?useSSL=false&serverTimezone=UTC
spring.datasource.username=notapp_user2
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT
# ==========================================

jwt.secret-key=MiClaveSuperSecretaHelpDeskCesde2026JWT
jwt.expiration=86400000

# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

security.auth-mode=LOCAL
# security.auth-mode=SSO