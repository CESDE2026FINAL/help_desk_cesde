spring:
  application:
    name: help_desk_cesde

  datasource:
    url: jdbc:postgresql://localhost:5432/mesa_ayuda #Acá cambias el nombre de la base de datos por el tuyo
    username: postgres #Aquí queda por defecto
    password: 1234 #Acá pones la contraseña de tu postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret-key: MiClaveSuperSecretaHelpDeskCesde2026JWT
  expiration: 86400000

security:
  auth-mode: LOCAL
  # auth-mode: SSO